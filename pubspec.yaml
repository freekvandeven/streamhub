name: streamhub
description: "A Flutter M3U playlist streaming app for legal content."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.1.0
  material_ui: ^1.7.0
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.4.3
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_native_splash: ^2.4.8
  video_player: ^2.14.1
  chewie: ^1.17.2
  channel_categorizer:
    path: packages/channel_categorizer

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_iconica_analysis:
    hosted: https://forgejo.internal.iconica.nl/api/packages/internal/pub
    version: ^10.0.0
  environment_config: ^4.1.2
  flutter_launcher_icons: ^0.14.4
  image: ^4.12.0

flutter:
  uses-material-design: true
  assets:
    - dotenv

flutter_native_splash:
  color: "#667eea"
  color_dark: "#667eea"
  android_12:
    color: "#667eea"
    color_dark: "#667eea"
  web: true
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

  # Android adaptive icons
  adaptive_icon_background: "#667eea"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

  # Web configuration
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#667eea"
    theme_color: "#667eea"

  # Windows configuration
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48

  # macOS configuration
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
